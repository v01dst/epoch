[project]
name = "epoch"
version = "0.1.0"
description = "Work with Unix timestamps from your terminal. Zero dependencies, pure Python stdlib."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mahmoud Ahmed" }]

[project.scripts]
epoch = "epoch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]